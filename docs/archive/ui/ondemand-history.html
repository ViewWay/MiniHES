<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On Demand - History</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #333; }

  .layout { display: flex; height: 100vh; }

  /* 左侧导航 */
  .sidebar { width: 140px; background: #fff; border-right: 1px solid #e8e8e8; padding-top: 16px; }
  .sidebar .nav-item {
    padding: 12px 20px; font-size: 14px; color: #666; cursor: pointer; border-left: 3px solid transparent;
  }
  .sidebar .nav-item:hover { color: #26b5a0; background: #f9fffe; }
  .sidebar .nav-item.active { color: #26b5a0; border-left-color: #26b5a0; font-weight: 600; }

  /* 右侧主区域 */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* 选项卡 */
  .tabs { display: flex; gap: 0; background: #fff; border-bottom: 1px solid #e8e8e8; padding: 0 24px; }
  .tab {
    padding: 12px 24px; font-size: 14px; color: #999; cursor: pointer;
    border-bottom: 2px solid transparent; transition: all .2s;
  }
  .tab:hover { color: #26b5a0; }
  .tab.active { color: #26b5a0; border-bottom-color: #26b5a0; font-weight: 600; }

  /* History 内容区 */
  .history-content { flex: 1; padding: 20px 24px; overflow-y: auto; }

  /* 筛选栏 */
  .filter-bar {
    display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .filter-bar select, .filter-bar input {
    padding: 6px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 13px;
    outline: none; transition: border-color .2s;
  }
  .filter-bar select:focus, .filter-bar input:focus { border-color: #26b5a0; }
  .filter-bar select { min-width: 180px; }
  .btn {
    padding: 6px 16px; border: none; border-radius: 4px; font-size: 13px;
    cursor: pointer; transition: opacity .2s;
  }
  .btn:hover { opacity: .85; }
  .btn-primary { background: #26b5a0; color: #fff; }
  .btn-outline { background: #fff; color: #26b5a0; border: 1px solid #26b5a0; }

  /* 表格 */
  table {
    width: 100%; border-collapse: collapse; background: #fff;
    border-radius: 6px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  th {
    background: #f7f7f7; text-align: left; padding: 10px 14px; font-size: 13px;
    font-weight: 600; color: #555; border-bottom: 1px solid #e8e8e8;
  }
  td {
    padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f0f0f0; color: #444;
  }
  tr:hover td { background: #f9fffe; }
  .tag-read {
    display: inline-block; padding: 2px 10px; border-radius: 3px; font-size: 12px;
    background: #e6f7f4; color: #26b5a0;
  }
  .tag-write {
    display: inline-block; padding: 2px 10px; border-radius: 3px; font-size: 12px;
    background: #fff3e0; color: #e6a23c;
  }
  .status-ok { color: #26b5a0; font-weight: 600; }
  .status-fail { color: #f56c6c; font-weight: 600; }
  .no-data { text-align: center; padding: 40px; color: #bbb; font-size: 14px; }

  /* 分页 */
  .pagination {
    display: flex; justify-content: flex-end; align-items: center; gap: 6px;
    margin-top: 16px; font-size: 13px; color: #666;
  }
  .pagination button {
    padding: 4px 10px; border: 1px solid #d9d9d9; border-radius: 3px;
    background: #fff; cursor: pointer; font-size: 12px;
  }
  .pagination button.active-page { background: #26b5a0; color: #fff; border-color: #26b5a0; }
  .pagination button:hover { border-color: #26b5a0; }
</style>
</head>
<body>

<div class="layout">
  <!-- 左侧导航 -->
  <div class="sidebar">
    <div class="nav-item">General</div>
    <div class="nav-item">Parameter</div>
    <div class="nav-item">Tasks</div>
    <div class="nav-item">Communication</div>
    <div class="nav-item active">On Demand</div>
    <div class="nav-item">Config</div>
    <div class="nav-item">Logs</div>
  </div>

  <!-- 主区域 -->
  <div class="main">
    <!-- 选项卡: Config / History -->
    <div class="tabs">
      <div class="tab" onclick="switchTab('config', this)">Config</div>
      <div class="tab active" onclick="switchTab('history', this)">History</div>
    </div>

    <!-- Config 面板 (隐藏) -->
    <div id="panel-config" class="history-content" style="display:none;">
      <p style="color:#999;">Config content goes here...</p>
    </div>

    <!-- History 面板 -->
    <div id="panel-history" class="history-content">
      <!-- 筛选栏 -->
      <div class="filter-bar">
        <select id="filterItem">
          <option value="">All Data Items</option>
          <option>L1 Current (A)</option>
          <option>L2 Current (A)</option>
          <option>L3 Current (A)</option>
          <option>L1 Voltage (V)</option>
          <option>L2 Voltage (V)</option>
          <option>L3 Voltage (V)</option>
          <option>Active Energy Import (kWh)</option>
          <option>Active Energy Export (kWh)</option>
          <option>Reactive Energy Import (kvarh)</option>
          <option>Reactive Energy Export (kvarh)</option>
        </select>
        <input type="text" id="filterFrom" placeholder="From: MM/DD/YYYY HH:mm" style="width:190px;">
        <span style="color:#999;">—</span>
        <input type="text" id="filterTo" placeholder="To: MM/DD/YYYY HH:mm" style="width:190px;">
        <button class="btn btn-primary" onclick="applyFilter()">Search</button>
        <button class="btn btn-outline" onclick="resetFilter()">Reset</button>
      </div>

      <!-- 数据表格 -->
      <table id="historyTable"></table>

      <!-- 分页 -->
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<script>
// 模拟历史数据
const historyData = [
  { id: 1, item: 'L1 Current (A)',               time: 'Apr 20, 2026 09:32:15', value: '4.52',     type: 'Read', status: 'Success', duration: '1.2s' },
  { id: 2, item: 'L2 Current (A)',               time: 'Apr 20, 2026 09:32:15', value: '4.38',     type: 'Read', status: 'Success', duration: '1.1s' },
  { id: 3, item: 'L3 Current (A)',               time: 'Apr 20, 2026 09:32:16', value: '4.61',     type: 'Read', status: 'Success', duration: '0.9s' },
  { id: 4, item: 'L1 Voltage (V)',               time: 'Apr 20, 2026 09:32:17', value: '230.1',    type: 'Read', status: 'Success', duration: '1.3s' },
  { id: 5, item: 'L2 Voltage (V)',               time: 'Apr 20, 2026 09:32:17', value: '229.8',    type: 'Read', status: 'Success', duration: '1.0s' },
  { id: 6, item: 'L3 Voltage (V)',               time: 'Apr 20, 2026 09:32:18', value: '231.0',    type: 'Read', status: 'Success', duration: '1.4s' },
  { id: 7, item: 'Active Energy Import (kWh)',   time: 'Apr 20, 2026 09:33:02', value: '15234.67', type: 'Read', status: 'Success', duration: '2.3s' },
  { id: 8, item: 'Active Energy Export (kWh)',   time: 'Apr 20, 2026 09:33:03', value: '320.45',   type: 'Read', status: 'Success', duration: '2.1s' },
  { id: 9, item: 'Reactive Energy Import (kvarh)', time: 'Apr 20, 2026 09:33:04', value: '1023.12', type: 'Read', status: 'Success', duration: '2.5s' },
  { id: 10, item: 'Reactive Energy Export (kvarh)', time: 'Apr 20, 2026 09:33:05', value: '89.30',  type: 'Read', status: 'Success', duration: '2.0s' },
  { id: 11, item: 'L1 Current (A)',              time: 'Apr 20, 2026 08:15:42', value: '3.87',     type: 'Read', status: 'Success', duration: '1.5s' },
  { id: 12, item: 'L2 Current (A)',              time: 'Apr 20, 2026 08:15:43', value: '3.92',     type: 'Read', status: 'Success', duration: '1.3s' },
  { id: 13, item: 'L3 Current (A)',              time: 'Apr 20, 2026 08:15:43', value: '—',        type: 'Read', status: 'Failed',  duration: '30.0s' },
  { id: 14, item: 'L1 Voltage (V)',              time: 'Apr 20, 2026 08:15:44', value: '228.5',    type: 'Read', status: 'Success', duration: '1.1s' },
  { id: 15, item: 'Active Energy Import (kWh)',  time: 'Apr 19, 2026 17:45:10', value: '15201.33', type: 'Read', status: 'Success', duration: '2.4s' },
  { id: 16, item: 'L1 Current (A)',              time: 'Apr 19, 2026 14:20:05', value: '5.12',     type: 'Read', status: 'Success', duration: '1.0s' },
  { id: 17, item: 'L2 Current (A)',              time: 'Apr 19, 2026 14:20:06', value: '5.08',     type: 'Read', status: 'Success', duration: '1.2s' },
  { id: 18, item: 'L3 Current (A)',              time: 'Apr 19, 2026 14:20:06', value: '5.21',     type: 'Read', status: 'Success', duration: '0.8s' },
  { id: 19, item: 'L1 Voltage (V)',              time: 'Apr 19, 2026 14:20:07', value: '231.4',    type: 'Write', status: 'Success', duration: '3.6s' },
  { id: 20, item: 'Active Energy Import (kWh)',  time: 'Apr 18, 2026 10:05:33', value: '15102.88', type: 'Read', status: 'Success', duration: '2.2s' },
  { id: 21, item: 'L1 Current (A)',              time: 'Apr 18, 2026 10:05:30', value: '4.01',     type: 'Read', status: 'Success', duration: '1.4s' },
  { id: 22, item: 'L2 Current (A)',              time: 'Apr 18, 2026 10:05:31', value: '—',        type: 'Read', status: 'Failed',  duration: '30.0s' },
  { id: 23, item: 'Reactive Energy Import (kvarh)', time: 'Apr 18, 2026 10:05:35', value: '1018.50', type: 'Read', status: 'Success', duration: '2.7s' },
];

const PAGE_SIZE = 10;
let currentPage = 1;
let filtered = [...historyData];

function renderTable(data, page) {
  const start = (page - 1) * PAGE_SIZE;
  const pageData = data.slice(start, start + PAGE_SIZE);
  const table = document.getElementById('historyTable');

  if (pageData.length === 0) {
    table.innerHTML = `
      <thead><tr><th>#</th><th>Data Item</th><th>Time</th><th>Duration</th><th>Value</th><th>Type</th><th>Status</th></tr></thead>
      <tbody><tr><td colspan="7" class="no-data">No records found</td></tr></tbody>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  let html = `<thead><tr>
    <th style="width:50px">#</th>
    <th>Data Item</th>
    <th style="width:180px">Time</th>
    <th style="width:90px">Duration</th>
    <th style="width:120px">Value</th>
    <th style="width:80px">Type</th>
    <th style="width:80px">Status</th>
  </tr></thead><tbody>`;

  pageData.forEach((r, i) => {
    const tagClass = r.type === 'Read' ? 'tag-read' : 'tag-write';
    const statusClass = r.status === 'Success' ? 'status-ok' : 'status-fail';
    html += `<tr>
      <td>${start + i + 1}</td>
      <td>${r.item}</td>
      <td>${r.time}</td>
      <td>${r.duration}</td>
      <td>${r.value}</td>
      <td><span class="${tagClass}">${r.type}</span></td>
      <td><span class="${statusClass}">${r.status}</span></td>
    </tr>`;
  });

  html += '</tbody>';
  table.innerHTML = html;
  renderPagination(data.length, page);
}

function renderPagination(total, page) {
  const pages = Math.ceil(total / PAGE_SIZE);
  const el = document.getElementById('pagination');
  if (pages <= 1) { el.innerHTML = ''; return; }

  let html = `<span>Total ${total} records</span>`;
  html += `<button onclick="goPage(${page - 1})" ${page === 1 ? 'disabled' : ''}>&lt;</button>`;
  for (let i = 1; i <= pages; i++) {
    html += `<button class="${i === page ? 'active-page' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button onclick="goPage(${page + 1})" ${page === pages ? 'disabled' : ''}>&gt;</button>`;
  el.innerHTML = html;
}

function goPage(p) {
  const pages = Math.ceil(filtered.length / PAGE_SIZE);
  if (p < 1 || p > pages) return;
  currentPage = p;
  renderTable(filtered, currentPage);
}

function applyFilter() {
  const item = document.getElementById('filterItem').value;
  const fromStr = document.getElementById('filterFrom').value.trim();
  const toStr = document.getElementById('filterTo').value.trim();
  const fromDate = fromStr ? new Date(fromStr) : null;
  const toDate = toStr ? new Date(toStr) : null;

  filtered = historyData.filter(r => {
    if (item && r.item !== item) return false;
    if (fromDate && new Date(r.time) < fromDate) return false;
    if (toDate && new Date(r.time) > toDate) return false;
    return true;
  });

  currentPage = 1;
  renderTable(filtered, currentPage);
}

function resetFilter() {
  document.getElementById('filterItem').value = '';
  document.getElementById('filterFrom').value = '';
  document.getElementById('filterTo').value = '';
  filtered = [...historyData];
  currentPage = 1;
  renderTable(filtered, currentPage);
}

function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-config').style.display = tab === 'config' ? 'block' : 'none';
  document.getElementById('panel-history').style.display = tab === 'history' ? 'block' : 'none';
}

// 初始渲染
renderTable(filtered, currentPage);
</script>
</body>
</html>
