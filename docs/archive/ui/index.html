<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAIFA HES — Use Case & Reporting Prototypes</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #333; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* ── Top Bar ── */
.topbar {
  display: flex; align-items: center; height: 44px; background: #1a2332;
  padding: 0 20px; flex-shrink: 0; gap: 12px;
}
.topbar .logo { font-weight: 700; font-size: 16px; color: #26b5a0; letter-spacing: 1px; margin-right: 8px; white-space: nowrap; }
.topbar .subtitle { font-size: 12px; color: #8899aa; }
.topbar .spacer { flex: 1; }
.topbar .badge { font-size: 11px; color: #8899aa; background: #243040; padding: 3px 10px; border-radius: 10px; }

/* ── Body Layout ── */
.body { display: flex; flex: 1; overflow: hidden; }

/* ── Left Nav ── */
.nav { width: 240px; background: #fff; border-right: 1px solid #e8e8e8; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
.nav-header { padding: 12px 16px 8px; font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid #f0f0f0; }

.nav-scroll { flex: 1; overflow-y: auto; padding-bottom: 12px; }
.nav-scroll::-webkit-scrollbar { width: 4px; }
.nav-scroll::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 2px; }

/* Group header */
.nav-group { margin-top: 4px; }
.nav-group-header {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px 7px 12px; font-size: 11px; font-weight: 700;
  color: #888; text-transform: uppercase; letter-spacing: .4px;
  cursor: pointer; user-select: none; transition: background .12s;
}
.nav-group-header:hover { background: #f9f9f9; }
.nav-group-header .arrow { font-size: 9px; transition: transform .2s; margin-left: auto; color: #bbb; }
.nav-group-header.collapsed .arrow { transform: rotate(-90deg); }
.nav-group-header .group-icon { font-size: 13px; }

.nav-group-items { overflow: hidden; }
.nav-group-items.collapsed { display: none; }

/* Nav item */
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 14px 7px 24px; font-size: 12px; color: #555;
  cursor: pointer; border-left: 3px solid transparent; transition: all .12s;
  line-height: 1.3;
}
.nav-item:hover { color: #26b5a0; background: #f5fffe; }
.nav-item.active { color: #26b5a0; border-left-color: #26b5a0; font-weight: 600; background: #edfaf7; }
.nav-item .item-num { font-size: 10px; color: #bbb; min-width: 28px; flex-shrink: 0; }
.nav-item.active .item-num { color: #26b5a0; }

/* ── Content ── */
.content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* Breadcrumb */
.breadcrumb {
  display: flex; align-items: center; gap: 6px; padding: 8px 16px;
  background: #fff; border-bottom: 1px solid #e8e8e8; font-size: 12px; color: #999; flex-shrink: 0;
}
.breadcrumb .sep { color: #ddd; }
.breadcrumb .current { color: #333; font-weight: 500; }

/* Welcome screen */
.welcome {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #bbb; gap: 12px;
}
.welcome .welcome-icon { font-size: 48px; }
.welcome .welcome-title { font-size: 18px; color: #999; font-weight: 600; }
.welcome .welcome-sub { font-size: 13px; color: #bbb; }

/* iframe */
#frameContainer { flex: 1; display: none; overflow: hidden; }
#frameContainer iframe { width: 100%; height: 100%; border: none; display: block; }

/* Unclassified section */
.nav-unclassified .nav-item { padding-left: 24px; }
</style>
</head>
<body>

<!-- Top Bar -->

  <span class="badge">UI Prototype Index</span>

let activeFile = null;

function buildNav() {
  const scroll = document.getElementById('navScroll');
  let html = '';
  menu.forEach(group => {
    html += `
      <div class="nav-group" id="grp-${group.id}">
        <div class="nav-group-header" onclick="toggleGroup('${group.id}', this)">
          <span class="group-icon">${group.icon}</span>
          <span style="flex:1;font-size:11px;">${group.label}</span>
          <span class="arrow">▼</span>
        </div>
        <div class="nav-group-items" id="items-${group.id}">`;
    group.items.forEach(item => {
      html += `
          <div class="nav-item" id="nav-${item.file}" onclick="loadProto('${item.file}', '${escHtml(item.label)}', '${escHtml(group.label)}', this)">
            <span class="item-num">${item.num}</span>
            <span>${item.label}</span>
          </div>`;
    });
    html += `</div></div>`;
  });
  scroll.innerHTML = html;
}

function escHtml(s) { return s.replace(/'/g, "\\'"); }

function toggleGroup(id, headerEl) {
  headerEl.classList.toggle('collapsed');
  document.getElementById('items-' + id).classList.toggle('collapsed');
}

function loadProto(file, label, groupLabel, navEl) {
  // Update active nav
  document.querySelectorAll('.nav-item.active').forEach(el => el.classList.remove('active'));
  navEl.classList.add('active');

  // Breadcrumb
  document.getElementById('breadcrumbCurrent').textContent = label;

  // Show iframe
  document.getElementById('welcomeScreen').style.display = 'none';
  const fc = document.getElementById('frameContainer');
  fc.style.display = 'flex';
  fc.style.flex = '1';

  const frame = document.getElementById('protoFrame');
  if (activeFile !== file) {
    frame.src = file;
    activeFile = file;
  }

  // Scroll nav item into view
  navEl.scrollIntoView({ block: 'nearest' });
}

buildNav();
