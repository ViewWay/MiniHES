# MiniHES Git Hooks (lefthook)
# 对齐 CI 的 ruff 检查，在 commit 前自动跑 lint + format 校验。
# 首次使用需安装 lefthook 并执行 `lefthook install`。

pre-commit:
  parallel: true
  jobs:
    - name: ruff-check
      glob: "*.py"
      run: cd backend && uv run ruff check app/ tests/

    - name: ruff-format
      glob: "*.py"
      run: cd backend && uv run ruff format --check app/ tests/
